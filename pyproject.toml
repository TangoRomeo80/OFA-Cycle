[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cycle-ofa"
version = "0.1.0"
description = "Exact and Monte Carlo greedy online facility assignment on cycles"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Md. Rawha Siddiqi Riad"},
  {name = "Md. Tanzeem Rahat"},
  {name = "Md. Manzurul Hasan"},
]
keywords = ["online algorithms", "facility assignment", "cycles", "dynamic programming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
cycle-ofa = "cycle_ofa.cli:main"

[tool.setuptools.packages.find]
include = ["cycle_ofa*"]

[tool.setuptools.package-data]
cycle_ofa = ["py.typed"]
